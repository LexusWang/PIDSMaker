  - uuid: e55be3fd-3521-4610-9d1a-e210e42dcf05
    name: Reg Key Run
    id:
      - T1547.001
    source: ART
    supported_platforms:
      - windows
    tactics:
      - Persistence
      - Privilege Escalation
    technique:
      - 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
    description: |
      Run Key Persistence

      Upon successful execution, cmd.exe will modify the registry by adding \"Atomic Red Team\" to the Run key. Output will be via stdout. 
    execution:
      executor: Command Prompt Executor
      command: |
        REG ADD "HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" /V "Atomic Red Team" /t REG_SZ /F /D "#{command_to_execute}"
    arguments:
      Executor:
        description: The executor for this action
        required: true
        pddl_index: executor4
      command_to_execute:
        description: Thing to Run
        type: path
        default: C:\Path\AtomicRedTeam.exe
        pddl_index: string4
    dependencies:
    preconditions:
      - (os-windows ?target - host)
      - (command_prompt ?executor - executor ?target - host)
      - (file_exists ?command_to_execute - string ?file - file ?target - host)
      - (exe_file ?file - file)
    effects:
      - (file-execution-at-startup ?file - file ?target - host)
