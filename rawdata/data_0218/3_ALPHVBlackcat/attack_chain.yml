    source: Sliver
    supported_platforms:
      - windows
      - linux
    tactics:
      - Discovery
    technique:
      - System Information Discovery
    description: The `get_env` command retrieves environment variable values.
    execution:
      executor: Sliver Executor
      command: get_env(#{name},#{Executor})
    arguments:
      Executor:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor0
      name:
        description: Environment variable name to query
        required: true
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
      - (sliver_session ?executorID - executor ?target - host)
    effects:
      - (system_information_info ?target - host)
  - uuid: sliver-cmd
    name: Execute Command (cmd.exe)
    id:
      - T1059.003
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Execution
    technique:
      - |
        Command and Scripting Interpreter: Windows Command Shell
    description: The `cmd.exe` command executes a Windows command. It runs the specified
      command on the remote host and returns the result. This command is useful for
      performing various system tasks.
    execution:
      executor: Sliver Executor
      command: cmd(#{ParentExecutorID},#{Commands})
    arguments:
      ParentExecutorID:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor0
      DerivedExecutorID:
        description: The dervied Windows CMD executor.
        required: true
        pddl_index: executor2
    preconditions:
      - (os-windows ?t - host)
      - (sliver_session ?executorID - executor ?t - host)
    effects:
      - (command_prompt ?s2 - executor ?t - host)
      - operator: When
        params:
          condition: (elevated_executor ?executorID - executor)
          effect: (elevated_executor ?s2 - executor)
